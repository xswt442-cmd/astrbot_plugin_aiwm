[project]
name = "astrbot-plugin-aiwm"
version = "0.1.3"
description = "查完美竞技平台 CS2 战绩，让模型替你锐评。"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
# 项目包放在仓库根的 aiwm/ 而不是 src/ 布局，装成 editable 时能找到；
# 这一行让不安装本项目的环境（直接跑 pytest）也能 import。
pythonpath = [".", "test"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiwm"]
